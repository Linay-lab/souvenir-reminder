<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅購 Travel Studio｜獨立介面測試</title><style>:root{--bg:#FAF9F6;--blue:#B5CAD4;--olive:#A5AD96;--ink:#34423D}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:950px;margin:auto;padding:20px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 24px}h1{font-size:24px;margin:0}small,.muted{color:#79847D}h2{font-size:20px;margin:24px 0 12px}.paper{background:#fff;border:1px solid #ece9e4;border-radius:22px;padding:18px;box-shadow:0 5px 18px #3a473509}.hero{background:linear-gradient(125deg,#e9efed,#f8f3eb);padding:22px;border-radius:24px}.btn,button,select,input{font:inherit}button{cursor:pointer;border:1px solid #e6e6e2;background:#fff;color:var(--ink);padding:10px 14px;border-radius:12px}button.active,.primary{background:#91b2c3;color:#173d50;border-color:#91b2c3}input,select{padding:12px;border:1px solid #e5e4df;border-radius:12px;width:100%;background:#fff}label{display:block;font-size:13px;margin:12px 0 6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{padding:15px 4px;text-align:center;border-radius:16px;background:#eef2ed;font-size:13px}.tile:nth-child(2){background:#f8ede4}.tile:nth-child(3){background:#e9f0f3}.tile:nth-child(4){background:#eee9e2}.card{background:white;border:1px solid #eee9e3;border-radius:16px;overflow:hidden;cursor:pointer}.photo{height:118px;background:linear-gradient(140deg,#c6d6d6,#ece3d8);display:grid;place-items:center;font-size:40px}.card article{padding:10px;font-size:13px}.card strong{display:block;font-size:14px;margin-bottom:6px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{display:flex;align-items:center;justify-content:space-between;gap:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid #e7e7e3;display:flex;justify-content:center;gap:8px;padding:10px 12px max(12px,env(safe-area-inset-bottom))}nav button{border:0;background:transparent;min-width:70px;font-size:12px}nav button.active{color:#477d98;background:#e8f1f5}section{display:none}section.show{display:block}.pill{border-radius:100px;font-size:12px;padding:7px 11px}.sheet{position:fixed;inset:0;background:#17241b70;display:none;align-items:end;justify-content:center;z-index:5}.sheet.show{display:flex}.modal{background:var(--bg);padding:24px;width:min(100%,530px);max-height:90vh;overflow:auto;border-radius:25px 25px 0 0}.stack{display:grid;gap:10px}@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,1fr)}.tile{font-size:11px}.photo{height:100px}main{padding:14px 12px 110px}}</style><main><header><div><h1>◈ 旅購 <small style="font-size:12px">Travel Studio</small></h1><small>把喜歡的世界，慢慢收進來。</small></div><span>🌿</span></header><section id="home" class="show"><div class="hero"><h2 style="margin:0 0 8px">今天又發現什麼好東西？</h2><p class="muted">把想買、想去的地方先收藏起來。</p><button class="primary" onclick="showAdd()">＋ 快速收藏</button></div><div class="space"><h2>即將出發的旅行</h2><button onclick="tripOn=!tripOn;render()">切換有／無旅行</button></div><div id="tripHome"></div><h2>收藏分類</h2><div class="tiles"><div class="tile" onclick="go('library');setType('商品')">🛍️<br>商品</div><div class="tile" onclick="go('library');setType('餐廳')">🍴<br>餐廳</div><div class="tile" onclick="go('library');setType('景點')">🗺️<br>景點</div><div class="tile" onclick="go('library');setType('店家')">🏬<br>店家</div></div><h2>最近收藏</h2><div id="homeCards" class="grid"></div></section><section id="library"><div class="space"><h2>收藏庫</h2><button class="primary" onclick="showAdd()">＋ 新增</button></div><p class="muted">所有想買、想去的，都收藏在這裡。</p><input id="search" placeholder="搜尋名稱、城市、備註…" oninput="render()"><div class="line" style="margin:12px 0"><select id="type" onchange="render()"><option>全部</option><option>商品</option><option>餐廳</option><option>景點</option><option>店家</option></select><select id="country" onchange="render()"><option>全部國家</option><option>日本</option><option>韓國</option><option>台灣</option></select><button onclick="gridOn=!gridOn;render()">▦／☰</button></div><div id="libraryCards" class="grid"></div></section><section id="trips"><h2>我的旅行</h2><div class="paper"><h2>🇯🇵 福岡旅行</h2><p class="muted">旅行準備中 · 介面示範</p><div class="tiles"><div class="tile">📅<br>行程</div><div class="tile">🛍️<br>購物</div><div class="tile">💳<br>錢包</div><div class="tile">📍<br>地點</div></div><h2>已加入的收藏</h2><div id="tripItems" class="stack"></div></div></section><section id="profile"><h2>個人中心</h2><div class="paper">旅購獨立介面原型<br><p class="muted">不連接帳號、正式網站或資料庫。</p><button onclick="reset()">還原示範資料</button></div></section></main><nav><button data-go="home" class="active" onclick="go('home')">⌂<br>首頁</button><button data-go="library" onclick="go('library')">♡<br>收藏庫</button><button data-go="trips" onclick="go('trips')">▤<br>我的旅行</button><button data-go="profile" onclick="go('profile')">♙<br>個人中心</button></nav><div class="sheet" id="sheet"><div class="modal"><div class="space"><h2 id="modalTitle">新增收藏</h2><button onclick="closeSheet()">✕</button></div><div id="modalBody"></div></div></div><script>let items=[{id:1,name:'抹茶千層蛋糕',type:'商品',country:'日本',city:'福岡',emoji:'🍵',note:'下次一定要買！'},{id:2,name:'福岡咖啡廳',type:'餐廳',country:'日本',city:'福岡',emoji:'☕',note:'想去喝咖啡'},{id:3,name:'太宰府天滿宮',type:'景點',country:'日本',city:'太宰府',emoji:'🌸',note:'賞花散步'},{id:4,name:'日本必買伴手禮',type:'商品',country:'日本',city:'東京',emoji:'🎁',note:'送朋友'},{id:5,name:'福岡文具店',type:'店家',country:'日本',city:'福岡',emoji:'📚',note:'買文具'},{id:6,name:'一蘭拉麵',type:'餐廳',country:'日本',city:'福岡',emoji:'🍜',note:'晚餐'}];let joined=[],tripOn=true,gridOn=true,selected=null;const $=id=>document.getElementById(id);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){document.querySelectorAll('section').forEach(x=>x.classList.toggle('show',x.id===p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===p));render();window.scrollTo(0,0)}function setType(t){$('type').value=t;render()}function cards(arr){return arr.map(i=>'<div class="card" onclick="detail('+i.id+')"><div class="photo">'+i.emoji+'</div><article><strong>'+safe(i.name)+'</strong><small>'+safe(i.country)+' · '+safe(i.city)+'</small><br><small>'+safe(i.type)+'</small></article></div>').join('')||'<p class="muted">還沒有符合條件的收藏</p>'}function render(){let s=($('search').value||'').toLowerCase(),t=$('type').value,c=$('country').value;let filtered=items.filter(i=>(t==='全部'||i.type===t)&&(c==='全部國家'||i.country===c)&&[i.name,i.city,i.note].join(' ').toLowerCase().includes(s));$('libraryCards').innerHTML=cards(filtered);$('libraryCards').style.gridTemplateColumns=gridOn?'':'1fr';$('homeCards').innerHTML=cards(items.slice(-4).reverse());$('tripHome').innerHTML=tripOn?'<div class="paper"><strong>🇯🇵 福岡旅行</strong><p class="muted">旅行準備中 · 點進旅行管理</p><button onclick="go(\'trips\')">進入旅行 →</button></div><div class="tiles" style="margin-top:10px"><div class="tile">📅<br>行程</div><div class="tile">🛍️<br>購物</div><div class="tile">💳<br>錢包</div><div class="tile">📍<br>地點</div></div>':'<div class="paper muted">目前沒有進行中的旅行，先收藏喜歡的東西吧。</div>';$('tripItems').innerHTML=joined.map(id=>{let i=items.find(x=>x.id===id);return i?'<div class="paper">'+i.emoji+' '+safe(i.name)+'</div>':''}).join('')||'<p class="muted">尚未加入收藏</p>'}function openSheet(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('sheet').classList.add('show')}function closeSheet(){$('sheet').classList.remove('show')}function showAdd(){openSheet('新增收藏','<p class="muted">貼連結、上傳截圖、手動新增，任選一種即可。</p><label>來源連結（選填）</label><input id="url" placeholder="https://..."><label>圖片（選填；僅在本次操作中預覽）</label><input id="photo" type="file" accept="image/*"><label>名稱</label><input id="name" placeholder="例如：福岡必買點心"><label>類型</label><select id="newType"><option>商品</option><option>餐廳</option><option>景點</option><option>店家</option></select><label>城市（選填）</label><input id="city" placeholder="福岡"><label>備註</label><input id="note" placeholder="想買、想去的原因"><p><button class="primary" onclick="save()">儲存收藏</button></p>')}function save(){let n=$('name').value.trim(),url=$('url').value.trim();if(!n&&!url&&!$('photo').files.length){alert('請至少填寫名稱、連結或圖片');return}items.unshift({id:Date.now(),name:n||url||'圖片收藏',type:$('newType').value,country:'日本',city:$('city').value.trim(),emoji:$('photo').files.length?'🖼️':'📌',note:$('note').value.trim(),url});closeSheet();go('library')}function detail(id){selected=id;let i=items.find(x=>x.id===id);openSheet(i.name,'<div class="photo" style="height:180px">'+i.emoji+'</div><p>'+safe(i.country)+' · '+safe(i.city)+' · '+safe(i.type)+'</p><p>'+safe(i.note)+'</p>'+(i.url?'<p><a target="_blank" rel="noopener noreferrer" href="'+safe(i.url)+'">查看來源</a></p>':'')+'<div class="line"><button class="primary" onclick="addTrip()">加入旅行</button><button onclick="closeSheet()">返回</button></div>')}function addTrip(){let i=items.find(x=>x.id===selected);openSheet('加入旅行','<p>'+safe(i.name)+'</p><label><input type="checkbox" checked disabled style="width:auto"> 福岡旅行</label><p class="muted">原始收藏會保留在收藏庫。</p><button class="primary" onclick="confirmTrip()">確認加入</button>')}function confirmTrip(){if(!joined.includes(selected))joined.push(selected);closeSheet();alert('已加入福岡旅行，原始收藏仍保留');render()}function reset(){location.reload()}render();</script></html>
